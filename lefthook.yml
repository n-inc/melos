# Lefthook configuration
# https://github.com/evilmartians/lefthook

pre-commit:
  commands:
    eslint-fix:
      glob: "**/*.{js,jsx,ts,tsx,mjs,cjs}"
      run: npm run lint:fix -- {staged_files}
      stage_fixed: true

pre-push:
  parallel: true
  commands:
    typecheck:
      run: npm run typecheck

    block-session-files:
      run: |
        for file in {push_files}; do
          file="$(printf '%s' "$file" | tr -d '\r\n')"
          case "$file" in
            PROGRESS.md|*/PROGRESS.md|HANDOFF.md|*/HANDOFF.md|WORK_REPORT.json|*/WORK_REPORT.json|.smoke-test/*)
              echo "Error: Session files must not be pushed: $file"
              exit 1
              ;;
          esac
        done
